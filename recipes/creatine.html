<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creatine</title>
</head>
<body>
    <h1>Creatine</h1>

    <img src="../images/creatine.jpg" alt="Creatine Monohydrate" width="300">

    <h2>Ingredients</h2>
    <ul>
        <li>Shaker</li>
        <li>Creatine</li>
        <li>Water</li>
    </ul>

    <h2>Steps</h2>
    <ol>
        <li>
            <p>Pour some water in your shaker. I prefer at least more than a glass of water.</p>
        </li>
        <li>
            <p>Add 3-5 grams of creatine in the water.</p>
        </li>
        <li>
            <p>Shake well for a few seconds, or minutes if you want to.</p>
        </li>
        <li>
            <p>Drink it!</p>
        </li>
    </ol>

    <p>Back to <a href="../index.html">homepage</a></p>
</body>
</html>
